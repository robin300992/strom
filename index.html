  .knopf { background: var(--hero); color: #fff; border: 0; border-radius: 10px;
    padding: 11px 16px; font-weight: 600; cursor: pointer; }
  .link { background: none; border: 0; color: var(--text-3); text-decoration: underline;
    cursor: pointer; padding: 0; font-size: 13px; }

  /* Anmeldung */
  #anmeldung { max-width: 380px; margin: 12vh auto 0; }
  #anmeldung input[type=password] { width: 100%; font: inherit; padding: 12px; margin: 12px 0 10px;
    border-radius: 10px; border: 1px solid var(--rand); background: var(--karte); color: var(--text); }
  #anmeldung label { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; }
  #fehler { color: var(--kritisch); min-height: 1.4em; margin-top: 8px; }

  /* Hero */
  .hero { background: linear-gradient(160deg, var(--hero), var(--hero-2)); color: #fff;
    border: 0; padding: 18px; }
  .hero .etikett { color: #c9d3e3; font-size: 13px; }
  .hero .wert { color: var(--gelb); font-size: 44px; font-weight: 700; line-height: 1.05;
    margin: 4px 0 2px; letter-spacing: -0.5px; }
  .hero .wert small { font-size: 20px; font-weight: 600; }
  .hero .wert.gut { color: var(--gut); }
  .hero .wert.schlecht { color: var(--kritisch); }
  .hero .unter { color: #e4e9f1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 7px 10px; min-width: 84px; }
  .chip b { display: block; font-size: 17px; color: #fff; }
  .chip span { font-size: 12px; color: #c9d3e3; }

  /* Status */
  .status { display: flex; gap: 12px; align-items: flex-start; border-width: 0 0 0 6px;
    border-style: solid; }
  .status .icon { width: 28px; height: 28px; border-radius: 50%; color: #fff; display: grid;
    place-items: center; font-weight: 700; flex: none; }
  .status.gut { border-color: var(--gut); } .status.gut .icon { background: var(--gut); }
  .status.warn { border-color: var(--warn); } .status.warn .icon { background: var(--warn); }
  .status.kritisch { border-color: var(--kritisch); } .status.kritisch .icon { background: var(--kritisch); }
  .status b { display: block; }

  /* Kacheln */
  .kacheln { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  .kacheln .karte { margin: 0; }
  .kachel .gross { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .gross.gut { color: var(--gut); } .gross.mittel { color: var(--gelb-text); } .gross.schlecht { color: var(--kritisch); }
  .balken { height: 10px; border-radius: 5px; background: var(--gitter); position: relative;
    margin: 10px 0 6px; overflow: visible; }
  .balken i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--s-heizung); }
  .balken em { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }

  /* Tabelle */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 7px 4px; text-align: right; white-space: nowrap; font-size: 14px; border-bottom: 1px solid var(--gitter); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  .tabelle { overflow-x: auto; }
  th { font-size: 12px; color: var(--text-3); font-weight: 600; }
  .plus { color: var(--kritisch); } .minus { color: var(--gut); }

  /* Diagramme */
  .legende { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  .legende span::before { content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 3px; background: var(--f); margin-right: 6px; vertical-align: -1px; }
  .legende span.linie::before { height: 2px; vertical-align: 3px; border-radius: 1px; }
  .diagramm { width: 100%; position: relative; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }
  #tip { position: fixed; pointer-events: none; background: var(--karte); color: var(--text);
    border: 1px solid var(--rand); border-radius: 10px; padding: 8px 10px; font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15); display: none; z-index: 10; max-width: 240px; }
  #tip b { display: block; margin-bottom: 2px; }
  #ziehen { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; transform: translateX(-50%);
    background: var(--karte); color: var(--text-2); border: 1px solid var(--rand); border-radius: 20px;
    padding: 6px 14px; font-size: 13px; display: none; pointer-events: none; z-index: 20; }
  #tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }

  .heat { display: grid; gap: 3px; font-size: 11px; }
  .heat div { border-radius: 4px; padding: 7px 0; font-size: 10px; text-align: center; font-variant-numeric: tabular-nums; }
  .heat .k { color: var(--text-3); padding: 4px 0; }
  .skala { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-3); }
  .skala i { flex: 1; height: 8px; border-radius: 4px;
    background: linear-gradient(90deg, var(--seq-0), var(--seq-2), var(--seq-4), var(--seq-6), var(--seq-7)); }

  .liste { margin: 0; padding: 0; list-style: none; }
  .liste li { padding: 8px 0; border-bottom: 1px solid var(--gitter); }
  .liste li:last-child { border: 0; }
  footer { margin-top: 22px; text-align: center; }
  a { color: var(--s-heizung); }

  @media (max-width: 480px) {
    .hero .wert { font-size: 38px; }
    th, td { font-size: 13px; padding: 6px 2px; }
    td:first-child { max-width: 96px; }
    .kacheln { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<main>
  <section id="anmeldung">
    <h1>Strom</h1>
    <p class="klein">Die Daten sind verschlüsselt. Bitte Passwort eingeben.</p>
    <form id="form">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Passwort" required>
      <label class="klein"><input type="checkbox" id="merken" checked> Auf diesem Gerät merken</label>
      <button class="knopf" type="submit" id="los">Öffnen</button>
      <div id="fehler" class="klein"></div>
    </form>
  </section>
  <section id="inhalt" hidden></section>
</main>
<div id="tip"></div>
<div id="ziehen"></div>
<script>
"use strict";
if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) document.documentElement.classList.add("app");
const MONATE = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MK = ["J","F","M","A","M","J","J","A","S","O","N","D"];
const SPEICHER = "strom-seite-schluessel";
const SEITE_VERSION = "48674098e427";   // wird beim Veröffentlichen eingesetzt
const nf = (n, d = 0) => (n == null || isNaN(n)) ? "–" :
  new Intl.NumberFormat("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }).format(n);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const datum = s => s ? new Date(s.length <= 10 ? s + "T12:00" : s) : null;
const tagText = s => s ? datum(s).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }) : "–";
const key = (j, m) => `${j}-${String(m).padStart(2, "0")}`;

// ---------- Entschlüsseln ----------
async function schluesselAus(pw, salz, runden) {
  const basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256",
    salt: new TextEncoder().encode(salz), iterations: runden }, basis, 256);
  return new Uint8Array(bits);
}
async function entschluesseln(roh, paket) {
  const k = await crypto.subtle.importKey("raw", roh, "AES-GCM", false, ["decrypt"]);
  const klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(paket.iv) }, k, b64(paket.daten));
  return JSON.parse(new TextDecoder().decode(klar));
}
async function paketLaden() {
  const r = await fetch("daten.json?" + Date.now(), { cache: "no-store" });
  if (!r.ok) throw new Error("Daten nicht erreichbar");
  const paket = await r.json();
  // Gibt es eine neuere Seite? Dann einmal frisch laden (statt der gespeicherten alten Version)
  if (paket.seite && !SEITE_VERSION.startsWith("__") && paket.seite !== SEITE_VERSION
      && !location.search.includes(paket.seite)) {
    location.replace(location.pathname + "?v=" + paket.seite);
    return null;
  }
  return paket;
}
function gespeichert() { try { return localStorage.getItem(SPEICHER); } catch { return null; } }
function speichern(roh) { try { localStorage.setItem(SPEICHER, btoa(String.fromCharCode(...roh))); } catch {} }
function vergessen() { try { localStorage.removeItem(SPEICHER); } catch {} }

async function start() {
  const s = gespeichert();
  if (!s) return;
  let paket;
  try { paket = await paketLaden(); } catch (e) { return; }   // offline: alte Ansicht behalten
  if (!paket) return;                                          // neue Version wird geladen
  try { zeigen(await entschluesseln(b64(s), paket)); } catch (e) { vergessen(); }
  geladen = Date.now();
}

// Neu laden: nach unten ziehen oder Rückkehr in die App (nach mindestens 1 Minute)
let geladen = 0;
async function aktualisieren() {
  if (!gespeichert()) { location.reload(); return; }
  await start();
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && D && Date.now() - geladen > 60000) aktualisieren();
});
let ziehStart = null, ziehWeg = 0;
const ziehen = document.getElementById("ziehen");
const oben = () => (document.scrollingElement || document.documentElement).scrollTop <= 5;
function ziehHinweis(text, sichtbar) {   // nur einblenden, solange es etwas zu zeigen gibt
  ziehen.textContent = text; ziehen.style.opacity = sichtbar; ziehen.style.display = sichtbar ? "block" : "none";
}
document.addEventListener("touchstart", ev => {
  ziehStart = oben() && D && ev.touches.length === 1 ? ev.touches[0].clientY : null; ziehWeg = 0;
}, { passive: true });
document.addEventListener("touchmove", ev => {
  if (ziehStart == null) return;
  ziehWeg = ev.touches[0].clientY - ziehStart;
  if (ziehWeg > 10) ziehHinweis(ziehWeg > 60 ? "Loslassen zum Aktualisieren" : "Zum Aktualisieren ziehen", Math.min(1, ziehWeg / 60));
}, { passive: true });
function ziehEnde() {
  if (ziehStart == null) return;
  ziehStart = null;
  if (ziehWeg <= 60) { ziehHinweis("", 0); return; }
  ziehHinweis("Wird aktualisiert …", 1);
  aktualisieren().then(() => {
    const st = D && D.letzter_abruf ? datum(D.letzter_abruf).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
    ziehHinweis("Aktualisiert" + (st ? " · Stand " + st : ""), 1);
  }).catch(() => ziehHinweis("Keine Verbindung", 1))
    .finally(() => setTimeout(() => ziehHinweis("", 0), 1500));
}
document.addEventListener("touchend", ziehEnde);
document.addEventListener("touchcancel", ziehEnde);
document.getElementById("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const fehler = document.getElementById("fehler"), los = document.getElementById("los");
  fehler.textContent = ""; los.disabled = true; los.textContent = "Entschlüssele …";
  try {
    const paket = await paketLaden();
    if (!paket) return;
    const roh = await schluesselAus(document.getElementById("pw").value, paket.salz, paket.runden);
    const daten = await entschluesseln(roh, paket).catch(() => { throw new Error("Passwort falsch"); });
    if (document.getElementById("merken").checked) speichern(roh);
    zeigen(daten);
  } catch (e) {
    fehler.textContent = e.message;
  } finally { los.disabled = false; los.textContent = "Öffnen"; }
});

// ---------- Zeilenumbrüche: Zahl und Einheit nie trennen ----------
function zusammenhalten(wurzel) {
  const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT);
  for (let n = lauf.nextNode(); n; n = lauf.nextNode()) {
    const neu = n.nodeValue
      .replace(/(\d) (?=%|°|kWh|Kd|l\b|€|h\b|W\b|ct)/g, "$1\u00a0")
      .replace(/([A-Za-zÄÖÜäöüß.:]) (?=[\d−+±(])/g, "$1\u00a0");
    if (neu !== n.nodeValue) n.nodeValue = neu;
  }
}

// ---------- Tooltip ----------
const tip = document.getElementById("tip");
function tipZeigen(ev, html) {
  tip.innerHTML = html; zusammenhalten(tip); tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = ev.clientY - tip.offsetHeight - 12 < 8 ? ev.clientY + 16 : ev.clientY - tip.offsetHeight - 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const tipWeg = () => { tip.style.display = "none"; };
document.addEventListener("scroll", tipWeg, { passive: true });

// ---------- Diagramme (SVG) ----------
const NS = "http://www.w3.org/2000/svg";
function el(name, attr = {}, eltern) {
  const e = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attr)) e.setAttribute(k, v);
  if (eltern) eltern.appendChild(e);
  return e;
}
function skala(d0, d1, r0, r1) { return v => r0 + (v - d0) / (d1 - d0 || 1) * (r1 - r0); }
function schritte(min, max, n = 4) {
  const roh = (max - min) / n, p = Math.pow(10, Math.floor(Math.log10(roh || 1)));
  const s = [1, 2, 2.5, 5, 10].map(f => f * p).find(f => f >= roh) || p;
  const out = [];
  for (let v = Math.ceil(min / s) * s; v <= max + 1e-9; v += s) out.push(+v.toFixed(6));
  return out;
}
function rahmen(box, hoehe, ymin, ymax, einheit, dez = 0) {
  box.innerHTML = "";
  const B = Math.max(box.clientWidth, 280), L = 40, R = 8, O = 10, U = 24;
  const svg = el("svg", { viewBox: `0 0 ${B} ${hoehe}`, role: "img" }, box);
  const y = skala(ymin, ymax, hoehe - U, O);
  for (const t of schritte(ymin, ymax)) {
    el("line", { x1: L, x2: B - R, y1: y(t), y2: y(t), stroke: css("--gitter") }, svg);
    el("text", { x: L - 6, y: y(t) + 4, "text-anchor": "end" }, svg).textContent = nf(t, dez) + (einheit || "");
  }
  return { svg, B, L, R, O, U, y, innenB: B - L - R, hoehe };
}

function rundOben(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function linien(box, punkte, serien, opt) {
  // punkte: [{label, tip, werte:{name:wert}}], serien: [{name, farbe, titel, einheit}]
  const alle = punkte.flatMap(p => serien.map(s => p.werte[s.name])).filter(v => v != null);
  if (!alle.length) { box.innerHTML = '<p class="klein leise">Noch keine Daten.</p>'; return; }
  let lo = Math.min(...alle), hi = Math.max(...alle), pad = (hi - lo) * 0.12 || 1;
  lo = opt.min != null ? Math.min(opt.min, lo) : Math.floor(lo - pad); hi = opt.achseDez ? hi + pad : Math.ceil(hi + pad);
  const f = rahmen(box, opt.hoehe || 200, lo, hi, opt.einheit || "", opt.achseDez || 0);
  const x = i => f.L + (punkte.length === 1 ? f.innenB / 2 : i / (punkte.length - 1) * f.innenB);
  const jede = Math.max(1, Math.ceil(punkte.length / (opt.labels || 8)));
  if (opt.raster) punkte.forEach((p, i) =>
    el("line", { x1: x(i), x2: x(i), y1: f.O, y2: f.hoehe - f.U, stroke: css("--gitter") }, f.svg));
  punkte.forEach((p, i) => { if (p.label && i % jede === 0)
    el("text", { x: x(i), y: f.hoehe - 8, "text-anchor": "middle" }, f.svg).textContent = p.label; });
  for (const s of serien) {
    let d = "", stift = false;
    punkte.forEach((p, i) => {
      const v = p.werte[s.name];
      if (v == null) { if (!opt.verbinden) stift = false; return; }
      d += (stift ? "L" : "M") + x(i).toFixed(1) + "," + f.y(v).toFixed(1); stift = true;
    });
    el("path", { d, fill: "none", stroke: s.farbe, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, f.svg);
    if (opt.punkte) punkte.forEach((p, i) => { const v = p.werte[s.name];
      if (v != null) el("circle", { cx: x(i), cy: f.y(v), r: 3.5, fill: s.farbe, stroke: css("--karte"), "stroke-width": 2 }, f.svg); });
  }
  const strich = el("line", { y1: f.O, y2: f.hoehe - f.U, stroke: css("--text-3"), "stroke-dasharray": "3 3", visibility: "hidden" }, f.svg);
  const flaeche = el("rect", { x: f.L, y: f.O, width: f.innenB, height: f.hoehe - f.O - f.U, fill: "transparent" }, f.svg);
  flaeche.addEventListener("pointermove", ev => {
    const r = f.svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * f.B;
    const i = Math.max(0, Math.min(punkte.length - 1, Math.round((px - f.L) / f.innenB * (punkte.length - 1))));
    strich.setAttribute("x1", x(i)); strich.setAttribute("x2", x(i)); strich.setAttribute("visibility", "visible");
    const p = punkte[i];
    tipZeigen(ev, `<b>${p.tip}</b>` + serien.map(s => `<i style="background:${s.farbe}"></i>${s.titel} ${nf(p.werte[s.name], opt.dez || 0)}${s.einheit}`).join("<br>"));
  });
  flaeche.addEventListener("pointerleave", () => { strich.setAttribute("visibility", "hidden"); tipWeg(); });
}

// ---------- Rechnen ----------
let D;
const WT = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const tag = s => D.tage[s] || {};
const kosten = (kwh, tage) => D.tarif.ct == null || kwh == null ? null : kwh * D.tarif.ct / 100 + (D.tarif.grund || 0) * 12 / 365 * tage;
const euroText = (kwh, tage) => { const k = kosten(kwh, tage); return k == null ? "" : ` · ca. ${nf(k, k < 100 ? 2 : 0)} €`; };
const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function zeitraum(von, bis) {        // kWh und Anzahl Tage mit Daten (Datumsstrings einschließlich)
  let kwh = 0, n = 0;
  for (const [t, e] of Object.entries(D.tage)) if (t >= von && t <= bis && e.kwh != null) { kwh += e.kwh; n++; }
  return { kwh, n };
}
function delta(neu, alt) {
  if (neu == null || !alt) return "";
  const d = Math.round((neu / alt - 1) * 100);
  if (d === 0) return '<span class="leise">±0 %</span>';
  return `<span class="${d > 0 ? "plus" : "minus"}">${d > 0 ? "+" : "−"}${nf(Math.abs(d))} %</span>`;
}

// Farbe nach Verbrauch pro Tag: bis 10 kWh grün, um 12,5 kWh gelb, ab 15 kWh rot (fließender Übergang)
const FARBE_VON = 10, FARBE_BIS = 15;
const GRUEN = [12, 163, 12], GELB = [230, 170, 0], ROT = [208, 59, 59];
function verbrauchsFarbe(kwhTag) {
  if (kwhTag == null) return null;
  const t = Math.max(0, Math.min(1, (kwhTag - FARBE_VON) / (FARBE_BIS - FARBE_VON)));
  const [a, b, u] = t < 0.5 ? [GRUEN, GELB, t * 2] : [GELB, ROT, (t - 0.5) * 2];
  return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(",")})`;
}
const farbSkala = `<div class="skala"><span>≤ ${FARBE_VON} kWh</span><i style="background:linear-gradient(90deg, rgb(${GRUEN}), rgb(${GELB}), rgb(${ROT}))"></i><span>≥ ${FARBE_BIS} kWh pro Tag</span></div>`;

function balken(box, punkte, opt) {
  // punkte: [{label, tip, wert, farbe, blass}]
  const werte = punkte.map(p => p.wert || 0);
  if (!werte.some(v => v > 0)) { box.innerHTML = '<p class="klein leise">Noch keine Daten.</p>'; return; }
  const max = Math.max(opt.minMax || 0.1, ...werte) * 1.08;
  const f = rahmen(box, opt.hoehe || 200, 0, max, opt.einheit || "", opt.achseDez || 0);
  const slot = f.innenB / punkte.length, bw = Math.max(3, Math.min(20, slot * 0.68));
  if (opt.mittel) {
    el("line", { x1: f.L, x2: f.B - f.R, y1: f.y(opt.mittel), y2: f.y(opt.mittel), stroke: css("--text-3"), "stroke-dasharray": "4 4" }, f.svg);
  }
  punkte.forEach((p, i) => {
    const cx = f.L + slot * i + slot / 2;
    if (p.label) el("text", { x: cx, y: f.hoehe - 8, "text-anchor": "middle" }, f.svg).textContent = p.label;
    if (p.wert > 0) { const y1 = f.y(p.wert);
      el("path", { d: rundOben(cx - bw / 2, y1, bw, f.y(0) - y1, 3), fill: p.farbe || css("--s-strom"),
        "fill-opacity": p.blass ? 0.45 : 1 }, f.svg); }
    const hit = el("rect", { x: f.L + slot * i, y: f.O, width: slot, height: f.hoehe - f.O - f.U, fill: "transparent" }, f.svg);
    hit.addEventListener("pointermove", ev => tipZeigen(ev, p.tip));
    hit.addEventListener("pointerleave", tipWeg);
  });
}

// ---------- Seite ----------
function zeigen(daten) {
  D = daten;
  document.getElementById("anmeldung").hidden = true;
  const box = document.getElementById("inhalt");
  box.hidden = false;
  const jetzt = new Date(), J = jetzt.getFullYear(), Mo = jetzt.getMonth() + 1;
  const heute = iso(jetzt), gestern = iso(new Date(J, Mo - 1, jetzt.getDate() - 1));
  const monatsAnfang = iso(new Date(J, Mo - 1, 1)), tageImMonat = new Date(J, Mo, 0).getDate();
  const a = D.aktuell || {};
  const abruf = datum(D.letzter_abruf), alterH = abruf ? (jetzt - abruf) / 36e5 : 99;

  // Monat bis heute (volle Tage + heute bisher)
  const mon = zeitraum(monatsAnfang, gestern), monKwh = mon.kwh + (D.heute_kwh || 0);
  const monSchnitt = mon.n ? mon.kwh / mon.n : null;
  const monHoch = monSchnitt != null ? monSchnitt * tageImMonat : null;
  // Vormonat zum Vergleich (Ø pro Tag)
  const vmEnde = new Date(J, Mo - 1, 0), vm = zeitraum(iso(new Date(J, Mo - 2, 1)), iso(vmEnde));
  const vmSchnitt = vm.n >= vmEnde.getDate() - 2 ? vm.kwh / vm.n : null;
  // Jahr hochgerechnet: Ø der letzten 30 vollen Tage
  const l30 = zeitraum(iso(new Date(J, Mo - 1, jetzt.getDate() - 30)), gestern);
  const jahrKwh = l30.n >= 7 ? l30.kwh / l30.n * 365 : null;
  // Grundlast: Minimum 2–5 Uhr, Median der letzten 7 Nächte
  const naechte = Object.entries(D.tage).filter(([t, e]) => t <= heute && e.grund_w != null).slice(-14);
  const g7 = median(naechte.slice(-7).map(([, e]) => e.grund_w)), gVor = median(naechte.slice(0, -7).map(([, e]) => e.grund_w));
  const gLetzte = naechte.length ? naechte[naechte.length - 1] : null;
  // Heizung (laut Buderus): Strom im laufenden Monat, Ø Leistung
  const hz = (D.heizung_strom || {})[key(J, Mo)];
  const stundenImMonat = (jetzt - new Date(J, Mo - 1, 1)) / 36e5;
  const hzW = hz != null && stundenImMonat > 12 ? hz / stundenImMonat * 1000 : null;

  // Gleicher Monat im Vorjahr (erst ab dem zweiten Aufzeichnungsjahr)
  const vjEnde = new Date(J - 1, Mo, 0), vjM = zeitraum(iso(new Date(J - 1, Mo - 1, 1)), iso(vjEnde));
  const vjSchnitt = vjM.n >= vjEnde.getDate() - 3 ? vjM.kwh / vjM.n : null;
  // Letzte Abrechnung und Prognose für die nächste
  const ab = D.abrechnung, abJahr = ab ? ab.kwh / ab.tage * 365 : null;
  let prog = null;
  const rate = l30.n >= 7 ? l30.kwh / l30.n : monSchnitt;
  if (ab && a.zaehler_kwh != null && rate != null && ab.naechste) {
    const rest = Math.max(0, (datum(ab.naechste) - jetzt) / 864e5), dauer = (datum(ab.naechste) - datum(ab.ende)) / 864e5;
    const kwh = a.zaehler_kwh - ab.zaehler + rate * rest;
    const kosten = D.tarif.ct != null ? kwh * D.tarif.ct / 100 + (D.tarif.grund || 0) * 12 / 365 * dauer : null;
    const gezahlt = ab.abschlag * ab.abschlaege;
    prog = { kwh, kosten, gezahlt, diff: kosten != null ? kosten - gezahlt : null };
  }

  // Status
  let st = { k: "gut", i: "✓", t: "Alles in Ordnung", s: "Der Zähler wird regelmäßig ausgelesen." };
  if (a.vorhanden === false || D.sensor_gemeldet) st = { k: "warn", i: "!", t: "Sensor prüfen",
    s: "Der FRITZ!Smart Energy 250 liefert keine neuen Werte. Sitzt er richtig auf der Info-LED? Batterien leer?" };
  else if (D.fehlversuche > 0) st = { k: "warn", i: "!", t: "FRITZ!Box nicht erreichbar",
    s: `Letzter Kontakt vor ca. ${nf(alterH)} h. Internet weg oder MyFRITZ!-Freigabe geändert?` };
  else if (alterH > 4) st = { k: "warn", i: "!", t: "Agent verspätet",
    s: `Letzte Prüfung vor ca. ${nf(alterH)} h. GitHub startet die Läufe gerade unzuverlässig.` };
  else if (a.batterie_leer) st = { k: "warn", i: "!", t: "Batterie fast leer", s: "Die Batterien im Sensor bald tauschen (2 × AA)." };

  box.innerHTML = `
    <div class="kopf"><div><h1>Strom</h1>
      <div class="klein leise">FRITZ!Smart Energy 250 · Stand ${abruf ? abruf.toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" }) : "–"}</div></div>
      <button class="link" id="abmelden">Abmelden</button></div>

    <section class="karte hero">
      <div class="etikett">Verbrauch ${MONATE[Mo - 1]} ${J} bis heute</div>
      <div class="wert zahl">${nf(monKwh)} <small>kWh</small></div>
      <div class="unter zahl">${kosten(monKwh, jetzt.getDate()) != null ? `ca. ${nf(kosten(monKwh, jetzt.getDate()))} € inkl. Grundpreis` : ""}${monSchnitt != null ? ` · Ø ${nf(monSchnitt, 1)} kWh pro Tag` : ""}</div>
      ${monHoch != null ? `<div class="unter klein zahl" style="margin-top:4px">Hochrechnung Monat: ca. ${nf(monHoch)} kWh${euroText(monHoch, tageImMonat)}</div>` : ""}
      ${vmSchnitt != null && monSchnitt != null ? `<div class="unter klein zahl" style="margin-top:4px">Vormonat: Ø ${nf(vmSchnitt, 1)} kWh pro Tag (${delta(monSchnitt, vmSchnitt)})</div>` : ""}
      ${hz != null ? `<div class="unter klein zahl" style="margin-top:4px;opacity:.85">davon Heizung ca. ${nf(hz)} kWh (laut Buderus)</div>` : ""}
      <div class="chips">
        <div class="chip"><b class="zahl">${nf(a.leistung_w)} W</b><span>Leistung jetzt</span></div>
        <div class="chip"><b class="zahl">${nf(D.heute_kwh, 1)} kWh</b><span>Heute bisher</span></div>
        <div class="chip"><b class="zahl">${gLetzte ? nf(gLetzte[1].grund_w) + " W" : "–"}</b><span>Grundlast letzte Nacht</span></div>
        ${a.batterie != null ? `<div class="chip"><b class="zahl">${nf(a.batterie)} %</b><span>Batterie</span></div>` : ""}
      </div>
    </section>

    <section class="karte status ${st.k}"><div class="icon" aria-hidden="true">${st.i}</div>
      <div><b>${st.t}</b><span class="klein">${st.s}</span></div></section>

    <div class="kacheln">
      <section class="karte kachel"><div class="klein">Grundlast (Minimum 2–5 Uhr)</div>
        <div class="gross zahl">${g7 != null ? nf(g7) + " W" : "–"}</div>
        <div class="klein">${g7 != null ? `≈ ${nf(g7 * 8.76)} kWh im Jahr${D.tarif.ct != null ? ` · ca. ${nf(g7 * 8.76 * D.tarif.ct / 100)} €` : ""}` : "Wird ab der nächsten Nacht gemessen."}</div>
        ${g7 != null && gVor != null ? `<div class="klein">Vorwoche ${nf(gVor)} W ${delta(g7, gVor)}</div>` : ""}
        ${hzW != null ? `<div class="klein leise" style="margin-top:4px">Heizung im Schnitt ca. ${nf(hzW)} W (Pumpe, Regelung, Brenner)</div>` : ""}</section>
      <section class="karte kachel"><div class="klein">Hochrechnung Jahr</div>
        <div class="gross zahl">${jahrKwh != null ? nf(jahrKwh, 0) + " kWh" : "–"}</div>
        <div class="klein">${jahrKwh != null ? `${D.tarif.ct != null ? `ca. ${nf(kosten(jahrKwh, 365))} € inkl. Grundpreis · ` : ""}aus Ø der letzten ${l30.n} Tage` : "Ab 7 vollen Tagen verfügbar."}</div>
        ${abJahr != null && jahrKwh != null ? `<div class="klein">Letzte Abrechnung ${nf(abJahr)} kWh ${delta(jahrKwh, abJahr)}</div>` : ""}
        ${D.tarif.ct != null ? `<div class="klein leise" style="margin-top:4px">Tarif ${nf(D.tarif.ct, 2)} ct/kWh · ${nf(D.tarif.grund, 2)} €/Monat</div>` : ""}</section>
      ${prog ? `<section class="karte kachel"><div class="klein">Prognose Abrechnung ${datum(ab.naechste).toLocaleDateString("de-DE", { month: "long", year: "numeric" })}</div>
        <div class="gross zahl ${prog.diff == null ? "" : prog.diff > 0 ? "schlecht" : "gut"}">${prog.diff == null ? nf(prog.kwh) + " kWh" : "ca. " + nf(Math.abs(prog.diff)) + " €"}</div>
        ${prog.diff == null ? "" : `<div class="klein"><b>${prog.diff > 0 ? "Nachzahlung" : "Gutschrift"}</b> (voraussichtlich)</div>`}        
        <div class="klein">ca. ${nf(prog.kwh)} kWh${prog.kosten != null ? ` · ca. ${nf(prog.kosten)} €` : ""} · Abschläge ${nf(prog.gezahlt)} €</div>
        <div class="klein leise" style="margin-top:4px">Grobe Schätzung: Zählerstand seit ${tagText(ab.ende)} plus Ø der letzten Wochen bis zum Abrechnungsende</div></section>` : ""}
      ${vjSchnitt != null && monSchnitt != null ? `<section class="karte kachel"><div class="klein">${MONATE[Mo - 1]} im Vergleich zum Vorjahr</div>
        <div class="gross zahl ${monSchnitt / vjSchnitt < 0.95 ? "gut" : monSchnitt / vjSchnitt > 1.05 ? "schlecht" : "mittel"}">${delta(monSchnitt, vjSchnitt).replace(/<[^>]+>/g, "")}</div>
        <div class="klein">Ø ${nf(monSchnitt, 1)} kWh pro Tag, Vorjahr Ø ${nf(vjSchnitt, 1)} kWh</div>
        <div class="klein leise" style="margin-top:4px">${MONATE[Mo - 1]} ${J - 1} gesamt: ${nf(vjM.kwh)} kWh</div></section>` : ""}
    </div>

    <section class="karte"><h2>Verbrauch pro Tag</h2>
      <div class="klein leise">kWh pro Tag</div>
      <div class="diagramm" id="d-tage"></div>${farbSkala}<div class="klein leise" style="margin-top:6px">letzte 30 Tage · gestrichelt: Durchschnitt · heute blass (läuft noch)</div></section>

    <section class="karte"><h2>Verbrauch der letzten 7 Tage</h2>
      <div class="klein leise">kWh pro Stunde</div>
      <div class="diagramm" id="d-stunden"></div><div class="klein leise">Lücken: kein Lauf des Agenten</div></section>

    <section class="karte"><h2>Grundlast pro Nacht</h2>
      <div class="legende"><span class="linie" style="--f:var(--s-strom)">Minimum 2–5 Uhr</span><span class="linie" style="--f:var(--s-alt)">Ø 1–5 Uhr</span></div>
      <div class="diagramm" id="d-grund"></div><div class="klein leise">Watt (dauerhafte Leistung) · das Minimum ist das, was dauerhaft läuft (Kühlschrank im Stand-by, Router, Geräte im Stand-by, Heizung)</div></section>

    <section class="karte"><h2>Verbrauch pro Monat</h2>
      <div class="klein leise">kWh pro Monat</div>
      <div class="diagramm" id="d-monate"></div>${farbSkala}<div class="klein leise" style="margin-top:6px">Farbe nach Ø pro Tag · blass: noch nicht vollständig aufgezeichnet</div></section>

    <footer class="klein leise">Daten: FRITZ!Box, Buderus-Cloud · erstellt ${datum(D.erstellt).toLocaleString("de-DE", { dateStyle: "short", timeStyle: "short" })} · Version ${SEITE_VERSION.slice(0, 6)}</footer>`;

  document.getElementById("abmelden").onclick = () => { vergessen(); location.reload(); };
  diagramme();
}

function diagramme() {
  if (!D) return;
  const jetzt = new Date(), heute = iso(jetzt);

  // Tage
  const tage = [...Array(30).keys()].map(i => new Date(jetzt.getFullYear(), jetzt.getMonth(), jetzt.getDate() - 29 + i));
  const voll = tage.map(iso).filter(t => t !== heute && tag(t).kwh != null).map(t => tag(t).kwh);
  balken(document.getElementById("d-tage"), tage.map(d => { const t = iso(d), heuteJa = t === heute;
    const kwh = heuteJa ? D.heute_kwh : tag(t).kwh, n = d.getDate();
    return { label: n === 1 || n % 5 === 0 ? `${n}.` : "", wert: kwh, farbe: verbrauchsFarbe(kwh), blass: heuteJa,
      tip: `<b>${WT[d.getDay()]} ${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}${heuteJa ? " (bis jetzt)" : ""}</b>` +
        (kwh != null ? `${nf(kwh, 1)} kWh${euroText(kwh, heuteJa ? 0 : 1)}` : "keine Daten") +
        (tag(t).grund_w != null ? `<br>Grundlast ${nf(tag(t).grund_w)} W` : "") }; }),
    { mittel: voll.length ? voll.reduce((a, b) => a + b, 0) / voll.length : null, achseDez: 0 });

  // Stunden
  const st = D.stunden || [];
  linien(document.getElementById("d-stunden"), st.map(p => { const d = datum(p.t + ":00");
    return { label: d.getHours() === 0 ? WT[d.getDay()] : "",
      tip: d.toLocaleString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }),
      werte: { w: p.w == null ? null : p.w / 1000 } }; }),
    [{ name: "w", farbe: css("--s-strom"), titel: "Verbrauch", einheit: " kWh" }],
    { einheit: "", labels: 1000, hoehe: 200, min: 0, achseDez: 2, dez: 2 });

  // Grundlast
  const naechte = Object.entries(D.tage).filter(([, e]) => e.grund_w != null || e.nacht_w != null).slice(-60);
  linien(document.getElementById("d-grund"), naechte.map(([t, e]) => { const d = datum(t);
    return { label: d.getDate() === 1 || d.getDate() % 7 === 0 ? `${d.getDate()}.${d.getMonth() + 1}.` : "",
      tip: `${WT[d.getDay()]} ${d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}`,
      werte: { g: e.grund_w, n: e.nacht_w } }; }),
    [{ name: "g", farbe: css("--s-strom"), titel: "Minimum", einheit: " W" },
     { name: "n", farbe: css("--s-alt"), titel: "Ø 1–5 Uhr", einheit: " W" }],
    { einheit: "", labels: 1000, punkte: naechte.length <= 31, min: 0 });

  // Monate (letzte 12)
  const monate = [...Array(12).keys()].map(i => new Date(jetzt.getFullYear(), jetzt.getMonth() - 11 + i, 1));
  balken(document.getElementById("d-monate"), monate.map(d => {
    const ende = new Date(d.getFullYear(), d.getMonth() + 1, 0), z = zeitraum(iso(d), iso(ende));
    const laufend = d.getMonth() === jetzt.getMonth() && d.getFullYear() === jetzt.getFullYear();
    const kwh = z.n ? z.kwh + (laufend ? D.heute_kwh || 0 : 0) : null;
    const komplett = !laufend && z.n >= ende.getDate() - 1;
    const hz = (D.heizung_strom || {})[key(d.getFullYear(), d.getMonth() + 1)];
    const proTag = z.n ? z.kwh / z.n : null;
    return { label: MK[d.getMonth()], wert: kwh, farbe: verbrauchsFarbe(proTag), blass: !komplett,
      tip: `<b>${MONATE[d.getMonth()]} ${d.getFullYear()}</b>` + (kwh != null ? `${nf(kwh)} kWh${euroText(kwh, komplett ? ende.getDate() : z.n)}<br>Ø ${nf(proTag, 1)} kWh pro Tag` +
        (komplett ? "" : `<br><span class="leise">${laufend ? "läuft noch" : `nur ${z.n} von ${ende.getDate()} Tagen aufgezeichnet`}</span>`) +
        (hz != null ? `<br>davon Heizung ca. ${nf(hz)} kWh` : "") : "keine Daten") };
  }), { achseDez: 0 });
  zusammenhalten(document.getElementById("inhalt"));
}
let warte;
addEventListener("resize", () => { clearTimeout(warte); warte = setTimeout(diagramme, 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => D && zeigen(D));
start();
</script>
